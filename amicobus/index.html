<style>
/* Layout: una sola colonna stretta come un telefono, pulsanti grandi, una cosa alla volta. */

    --ok: #5FD09A; --ok-bg: #143327; --warn: #F2B25C; --warn-bg: #3A2A10; --stop: #F38A80; --stop-bg: #3D1A17;

}
:root[data-theme="dark"] {
  --bg: #0E1920; --surface: #16252F; --ink: #E7EFF4; --muted: #A3B6C3; --line: #2C4250;

}

body {

label { font-weight: 700; display: flex; flex-direction: column; gap: 6px; font-size: 0.95rem; min-width: 0; }
input, select, textarea { font: inherit; font-weight: 400; color: var(--ink); background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; min-height: 52px; width: 100%; min-width: 0; }

pre.code { overflow-x: auto; background: var(--bg); border-radius: 12px; padding: 12px; font-size: 0.75rem; max-height: 220px; }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.keypad button { min-height: 68px; font-size: 1.5rem; }
.pin-dots { display: flex; gap: 14px; justify-content: center; }
.pin-dots span { width: 20px; height: 20px; border-radius: 50%; border: 3px solid var(--ink); }
.pin-dots span.on { background: var(--ink); }
.list-plain { margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 6px; }
a { color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { .card { animation: up .18s ease-out; } @keyframes up { from { transform: translateY(6px); } to { transform: none; } } }
</style>

<script>
(function () {
'use strict';

/* ---------- Dati fissi del servizio (fonte: ctmcagliari.it, pagina Amicobus) ---------- */
const COMUNI = ['Cagliari', "Quartu Sant'Elena", 'Monserrato', 'Selargius', 'Quartucciu', 'Elmas', 'Assemini', 'Decimomannu'];
const NUMERO_VERDE = '800 259 745';
const TEL = '800259745';

const SUS_URL = 'https://sus.regione.sardegna.it/sus';
const TARIFFA = 1.30;
const ASSOCIAZIONI = [
  { nome: 'A.N.M.I.C. Cagliari', indirizzo: 'Via Caprera 27, Cagliari', tel: '070 653865', email: 'anmic.cagliari@gmail.com' },
  { nome: 'Rp Sardegna OdV', indirizzo: 'Via Tola 30, Cagliari', tel: '070 6407661', email: 'rpsardegnaonlus@gmail.com' },
  { nome: 'UICI Onlus-APS Cagliari', indirizzo: 'Via Del Platano 27, Cagliari', tel: '070 523422', email: 'uicca@uiciechi.it' }
];
const EMOJI = ['🏠','🏫','🏥','🏢','🛒','⛪','🏊','⚽','🎨','🍽️','👵','👴','👨‍👩‍👧','💊','🌳','🎵','📚','🏖️','☕','🚉'];
const GIORNI = ['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];
const MESI = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
/* Orari del call center, in minuti dalla mezzanotte. Valgono anche per il modulo web. */
const FINESTRE = { 1: [[480, 780]], 2: [[480, 780]], 3: [[480, 780]], 4: [[480, 780]], 5: [[480, 780], [900, 1140]] };
const STORE = 'mioAmicobus.v1';

/* ---------- Utilità ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => (n < 10 ? '0' : '') + n;
const dayStart = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
const addDays = (d, k) => { const x = new Date(d); x.setDate(x.getDate() + k); return x; };
const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const fromIso = s => { const p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); };
const hm = m => pad(Math.floor(m / 60)) + ':' + pad(m % 60);
const toMin = s => { const p = (s || '0:0').split(':'); return (+p[0]) * 60 + (+p[1]); };
const minOf = d => d.getHours() * 60 + d.getMinutes();
const euro = v => v.toFixed(2).replace('.', ',') + ' €';
const uid = () => Math.random().toString(36).slice(2, 9);
function dataLunga(d) { return GIORNI[d.getDay()] + ' ' + d.getDate() + ' ' + MESI[d.getMonth()]; }
function dataUmana(d, now) {
  const oggi = dayStart(now || new Date());
  if (sameDay(d, oggi)) return 'oggi, ' + dataLunga(d);
  if (sameDay(d, addDays(oggi, 1))) return 'domani, ' + dataLunga(d);
  if (sameDay(d, addDays(oggi, 2))) return 'dopodomani, ' + dataLunga(d);
  return dataLunga(d);
}
function elencoGiorni(arr) {
  const n = arr.map(d => GIORNI[d.getDay()]);
  return n.length < 2 ? (n[0] || '') : n.slice(0, -1).join(', ') + ' e ' + n[n.length - 1];
}

/* ---------- Regole di prenotazione ---------- */
function giornoPrenotazione(viaggio) {
  const dow = viaggio.getDay();
  if (dow >= 2 && dow <= 5) return { giorno: addDays(viaggio, -1), finestre: [[480, 780]] };
  if (dow === 6) return { giorno: addDays(viaggio, -1), finestre: [[480, 780]] };
  if (dow === 0) return { giorno: addDays(viaggio, -2), finestre: [[480, 780]] };
  return { giorno: addDays(viaggio, -3), finestre: [[480, 780], [900, 1140]] };
}
function prenotabiliOra(now) {
  const out = [];
  for (let k = 1; k <= 3; k++) {
    const d = addDays(dayStart(now), k);
    if (S.prova) { out.push({ data: d, chiude: null }); continue; }
    const r = giornoPrenotazione(d);
    if (!sameDay(r.giorno, now)) continue;
    const m = minOf(now);
    const f = r.finestre.find(w => m >= w[0] && m < w[1]);
    if (f) out.push({ data: d, chiude: f[1] });
  }
  return out;
}
function prossimaFinestra(now) {
  for (let k = 0; k < 9; k++) {
    const g = addDays(dayStart(now), k);
    for (const f of (FINESTRE[g.getDay()] || [])) {
      const inizio = new Date(g); inizio.setMinutes(f[0]);
      if (inizio <= now) continue;
      const per = [];
      for (let j = 1; j <= 3; j++) {
        const d = addDays(g, j);
        const r = giornoPrenotazione(d);
        if (sameDay(r.giorno, g) && r.finestre.some(x => x[0] === f[0])) per.push(d);
      }
      return { inizio, fine: f[1], per };
    }
  }
  return null;
}
/* Per un giorno di viaggio: si può prenotare adesso, più avanti (con l'orario di apertura) o è troppo tardi. */
function finestraPer(dataViaggio, now) {
  if (S.prova) return { stato: 'ora', fine: null };
  const r = giornoPrenotazione(dataViaggio);
  for (const w of r.finestre) {
    const inizio = new Date(r.giorno); inizio.setMinutes(w[0]);
    const fine = new Date(r.giorno); fine.setMinutes(w[1]);
    if (now < inizio) return { stato: 'dopo', inizio, fine };
    if (now < fine) return { stato: 'ora', fine: w[1] };
  }
  return { stato: 'tardi' };
}
function callCenterAperto(now) {
  const m = minOf(now);
  return (FINESTRE[now.getDay()] || []).find(w => m >= w[0] && m < w[1]) || null;
}

/* ---------- Dati salvati sul telefono ---------- */
function esempio() {
  return {
    v: 1, esempio: true, pin: '1234', prova: false,
    profilo: { nome: 'Maria', cognome: 'Esempio', telefono: '333 000 0000', email: 'maria.esempio@example.com', accompagnatore: 'accompagnatore', posto: 'normale' },
    accredito: { scadenza: iso(addDays(new Date(), 25)) },
    luoghi: [
      { id: 'casa', nome: 'Casa', emoji: '🏠', indirizzo: 'Via Esempio 1', citta: 'Cagliari' },
      { id: 'centro', nome: 'Centro diurno', emoji: '🏫', indirizzo: 'Via del Centro 10', citta: "Quartu Sant'Elena" },
      { id: 'nonna', nome: 'Nonna Anna', emoji: '👵', indirizzo: 'Via dei Nonni 5', citta: 'Selargius' },
      { id: 'stadio', nome: 'Stadio (Distinti)', emoji: '⚽', indirizzo: 'Unipol Domus, ingresso dedicato settore Distinti', citta: 'Cagliari' }
    ],
    viaggi: [
      { id: 'v1', tipo: 'normale', emoji: '🏫', nome: 'Al Centro diurno', da: 'casa', a: 'centro', oraAndata: '08:30', ritorno: true, oraRitorno: '13:00' },
      { id: 'v2', tipo: 'normale', emoji: '👵', nome: 'Dalla nonna', da: 'casa', a: 'nonna', oraAndata: '16:00', ritorno: true, oraRitorno: '19:00' },
      { id: 'v3', tipo: 'partita', emoji: '⚽', nome: 'Partita del Cagliari', da: 'casa', a: 'stadio', oraAndata: '', ritorno: true, oraRitorno: '' }
    ],
    prenotazioni: []
  };
}
let storageOk = true;
function load() {
  try {
    const raw = localStorage.getItem(STORE);
    if (raw) { const s = JSON.parse(raw); if (s && s.v === 1) return s; }
  } catch (e) { storageOk = false; }
  return esempio();
}
function save() {
  try { localStorage.setItem(STORE, JSON.stringify(S)); storageOk = true; } catch (e) { storageOk = false; }
}
let S = load();
(function pulisci() {
  const limite = addDays(dayStart(new Date()), -30);
  S.prenotazioni = (S.prenotazioni || []).filter(p => fromIso(p.data) >= limite);
})();

const luogo = id => S.luoghi.find(l => l.id === id);
const viaggio = id => S.viaggi.find(v => v.id === id);
const pren = id => S.prenotazioni.find(p => p.id === id);
const nomeCompleto = () => (S.profilo.nome + ' ' + S.profilo.cognome).trim();

/* ---------- Stato della schermata ---------- */
let V = { view: 'home' };
let pinBuffer = '';
function go(view, extra) { V = Object.assign({ view }, extra || {}); render(); window.scrollTo(0, 0); }

/* ---------- Composizione della richiesta ---------- */
function dettagli(p) {
  const v = { emoji: p.emoji, nome: p.nome, tipo: p.tipo, da: p.da, a: p.a, ritorno: p.ritorno, oraAndata: p.oraAndata, oraRitorno: p.oraRitorno, oraPartita: p.oraPartita };
  const da = luogo(v.da) || {}, a = luogo(v.a) || {};
  let oraA = v.oraAndata, oraR = v.oraRitorno, testoA, testoR;
  if (v.tipo === 'partita') {
    const k = toMin(v.oraPartita || '15:00');
    testoA = 'Partita del Cagliari alle ' + (v.oraPartita || '15:00') + ': arrivo all\'ingresso Distinti entro le ' + hm(k - 60);
    testoR = 'Ritorno dopo la partita (le corse partono da 45 minuti dopo la fine)';
    oraA = 'Partita ore ' + (v.oraPartita || '15:00');
    oraR = 'Fine partita';
  }
  return { v, da, a, oraA, oraR, testoA, testoR, tratte: v.ritorno ? 2 : 1 };
}
function richiestaDa(viaggioObj, dataIso, oraPartita) {
  return {
    id: uid(), viaggioId: viaggioObj.id, data: dataIso, stato: 'nuova', canale: null, creata: new Date().toISOString(),
    emoji: viaggioObj.emoji, nome: viaggioObj.nome, tipo: viaggioObj.tipo, da: viaggioObj.da, a: viaggioObj.a,
    ritorno: viaggioObj.ritorno, oraAndata: viaggioObj.oraAndata, oraRitorno: viaggioObj.oraRitorno,
    oraPartita: oraPartita || null, passaggioAndata: '', passaggioRitorno: ''
  };
}
function b64url(obj) {
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  let bin = ''; bytes.forEach(b => { bin += String.fromCharCode(b); });
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function fromB64url(s) {
  let b = s.trim().replace(/-/g, '+').replace(/_/g, '/');
  while (b.length % 4) b += '=';
  const bin = atob(b); const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return JSON.parse(new TextDecoder().decode(bytes));
}
function linkCTM(p) {
  const d = dettagli(p), pr = S.profilo;
  const payload = {
    n: pr.nome, c: pr.cognome, t: pr.telefono, e: pr.email, d: p.data,
    acc: pr.accompagnatore === 'nessuno' ? '' : pr.accompagnatore,
    tipo: d.v.ritorno ? 'andataritorno' : 'andata',
    a: { p: d.da.indirizzo, pc: d.da.citta, a: d.a.indirizzo, ac: d.a.citta, o: d.oraA },
    s: dataLunga(fromIso(p.data)) + ': ' + (d.da.nome || '') + ' → ' + (d.a.nome || '') + (d.v.tipo === 'partita' ? '' : ' alle ' + d.oraA)
  };
  if (d.v.ritorno) payload.r = { p: d.a.indirizzo, pc: d.a.citta, a: d.da.indirizzo, ac: d.da.citta, o: d.oraR };
  return CTM_URL + '#amicobus=' + b64url(payload);
}
function copione(p) {
  const d = dettagli(p), pr = S.profilo;
  const righe = [
    'Buongiorno, sono ' + nomeCompleto() + '.',
    'Vorrei prenotare Amicobus per ' + dataLunga(fromIso(p.data)) + '.'
  ];
  if (d.v.tipo === 'partita') {

/* ---------- Promemoria nel calendario ---------- */
const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function linkApp(p) { return location.origin + location.pathname + '#bozza-' + p.id; }
function icsTesto(s) { return String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n'); }
function icsData(d) { return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + 'T' + pad(d.getHours()) + pad(d.getMinutes()) + '00'; }
function icsUTC(d) { return d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, ''); }
function icsPiega(riga) {
  const enc = new TextEncoder(); const out = []; let cur = '', n = 0;
  for (const ch of riga) {
    const b = enc.encode(ch).length;
    if (n + b > 73) { out.push(cur); cur = ' '; n = 1; }
    cur += ch; n += b;
  }
  out.push(cur); return out.join('\r\n');
}
function promemoriaDati(p) {
  const d = dettagli(p);
  const inizio = new Date(p.apertura), fine = new Date(p.chiusura);
  const titolo = 'Prenota Amicobus: ' + p.nome + ' (' + dataLunga(fromIso(p.data)) + ')';
  const testo = 'Da adesso puoi mandare la prenotazione di Amicobus per ' + dataLunga(fromIso(p.data)) + ': ' +
    (d.da.nome || '') + ' → ' + (d.a.nome || '') + '. Hai tempo fino alle ' + hm(minOf(fine)) + '.\n' +
    'Tocca qui per aprire l\'app con il viaggio già pronto: ' + linkApp(p);
  return { inizio, fine, titolo, testo };
}
function icsPer(p) {
  const m = promemoriaDati(p);
  const fineEvento = new Date(m.inizio.getTime() + 30 * 60000);
  const ultimaOra = Math.max(0, Math.round((m.fine - m.inizio) / 60000) - 60);
  const righe = [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//iAvvocato//Il mio Amicobus//IT', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
    'BEGIN:VTIMEZONE', 'TZID:Europe/Rome',
    'BEGIN:DAYLIGHT', 'TZOFFSETFROM:+0100', 'TZOFFSETTO:+0200', 'TZNAME:CEST', 'DTSTART:19700329T020000', 'RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU', 'END:DAYLIGHT',
    'BEGIN:STANDARD', 'TZOFFSETFROM:+0200', 'TZOFFSETTO:+0100', 'TZNAME:CET', 'DTSTART:19701025T030000', 'RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU', 'END:STANDARD',
    'END:VTIMEZONE',
    'BEGIN:VEVENT',
    'UID:' + p.id + '@apps.iavvocato.cloud',
    'DTSTAMP:' + icsUTC(new Date()),
    'DTSTART;TZID=Europe/Rome:' + icsData(m.inizio),
    'DTEND;TZID=Europe/Rome:' + icsData(fineEvento),
    'SUMMARY:' + icsTesto('🚌 ' + m.titolo),
    'DESCRIPTION:' + icsTesto(m.testo),
    'URL:' + linkApp(p),
    'BEGIN:VALARM', 'ACTION:DISPLAY', 'TRIGGER:PT0M', 'DESCRIPTION:' + icsTesto('È il momento di prenotare Amicobus'), 'END:VALARM',
    'BEGIN:VALARM', 'ACTION:DISPLAY', 'TRIGGER:PT' + ultimaOra + 'M', 'DESCRIPTION:' + icsTesto('Ultima ora per prenotare Amicobus'), 'END:VALARM',
    'END:VEVENT', 'END:VCALENDAR'
  ];
  return righe.map(icsPiega).join('\r\n') + '\r\n';
}
function linkGoogleCalendar(p) {
  const m = promemoriaDati(p);
  const fineEvento = new Date(m.inizio.getTime() + 30 * 60000);
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE' +
    '&text=' + encodeURIComponent('🚌 ' + m.titolo) +
    '&dates=' + icsData(m.inizio) + '/' + icsData(fineEvento) +
    '&ctz=Europe/Rome' +
    '&details=' + encodeURIComponent(m.testo);
}
function hrefIcs(p) {
  const ics = icsPer(p);
  if (isIOS()) return { href: 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics), download: '' };
  try { return { href: URL.createObjectURL(new Blob([ics], { type: 'text/calendar;charset=utf-8' })), download: 'amicobus-promemoria.ics' }; }
  catch (e) { return { href: 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics), download: 'amicobus-promemoria.ics' }; }
}
function quandoAperta(inizio, fine, now) {
  const g = sameDay(inizio, now) ? 'oggi' : sameDay(inizio, addDays(dayStart(now), 1)) ? 'domani, ' + dataLunga(inizio) : dataLunga(inizio);
  return g + ', dalle ' + hm(minOf(inizio)) + ' alle ' + hm(minOf(fine));
}

function datiMancanti(v) {
  const m = [];
  if (!S.profilo.nome || !S.profilo.cognome) m.push('nome e cognome');
  if (!S.profilo.telefono) m.push('numero di telefono');
  const da = luogo(v.da), a = luogo(v.a);
  if (!da || !da.indirizzo) m.push('indirizzo di partenza');
  if (!a || !a.indirizzo) m.push('indirizzo di arrivo');
  if (v.tipo !== 'partita' && !v.oraAndata) m.push('orario di andata');
  if (v.tipo !== 'partita' && v.ritorno && !v.oraRitorno) m.push('orario di ritorno');
  return m;
}

/* ---------- Voce ---------- */
function parla(testo) {
  try {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(testo);
    u.lang = 'it-IT'; u.rate = 0.9;
    window.speechSynthesis.speak(u);
  } catch (e) { /* voce non disponibile */ }
}
async function copia(testo, btn) {
  try { await navigator.clipboard.writeText(testo); if (btn) { const t = btn.textContent; btn.textContent = 'Copiato ✓'; setTimeout(() => { btn.textContent = t; }, 1800); } }
  catch (e) { if (btn) btn.textContent = 'Seleziona il testo e copialo'; }
}

const VIEWS = {

}

function numeroBlock(aperto, pf, now) {
  return '<section class="card ' + (aperto ? 'signal ok' : 'signal stop') + '"><div class="signal-head"><span class="lamp" aria-hidden="true"></span><h2>' + (aperto ? 'Il call center è aperto' : 'Il call center è chiuso') + '</h2></div>' +

/* ---------- Disegno ---------- */
function render() {
  const now = new Date();
  const fn = VIEWS[V.view] || VIEWS.home;
  document.getElementById('app').innerHTML = fn(now);
}

/* ---------- Modifica impostazioni ---------- */
function setPath(path, value) {
  const parts = path.split('.');
  let o = S;
  for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]] = o[parts[i]] || {};
  o[parts[parts.length - 1]] = value;
}
document.addEventListener('change', e => {
  const el = e.target;
  if (!el.dataset || !el.dataset.p) return;
  const val = el.type === 'checkbox' ? el.checked : el.value;
  if (el.dataset.p === 'pin' && !/^[0-9]{4}$/.test(val)) return;
  setPath(el.dataset.p, val);
  if (el.dataset.p !== 'prova' && el.dataset.p !== 'pin') S.esempio = false;
  save();
  if (el.type === 'checkbox' || el.tagName === 'SELECT') {
    const open = [...document.querySelectorAll('details')].map(d => d.open);
    render();
    document.querySelectorAll('details').forEach((d, i) => { d.open = !!open[i]; });
  }
});

/* ---------- Azioni ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el) return;
  const a = el.dataset.a;
  const now = new Date();
  switch (a) {
    case 'home': pinBuffer = ''; go('home'); break;
    case 'scegli': go('scegli'); break;
    case 'chiama': go('chiama'); break;
    case 'info': go('info'); break;
    case 'accredito': go('accredito'); break;
    case 'viaggio': {
      const v = viaggio(el.dataset.id);
      go('giorno', { viaggioId: v.id });
      break;
    }
    case 'salva-bozza': {
      const p = V.bozza;
      const f = finestraPer(fromIso(p.data), now);
      if (f.stato !== 'dopo') { render(); break; }
      p.stato = 'bozza'; p.apertura = f.inizio.toISOString(); p.chiusura = f.fine.toISOString();
      if (!S.prenotazioni.find(x => x.id === p.id)) S.prenotazioni.push(p);
      save(); go('promemoria', { id: p.id, salvata: true }); break;
    }
    case 'promemoria': go('promemoria', { id: el.dataset.id }); break;
    case 'apri-bozza': { const p = pren(el.dataset.id); if (p) go('riepilogo', { bozza: p }); break; }
    case 'data': scegliData(viaggio(V.viaggioId), el.dataset.d); break;
    case 'orapartita': V.bozza.oraPartita = el.dataset.o; go('riepilogo', { bozza: V.bozza }); break;
    case 'orapartita-altro': { const t = document.getElementById('partita-altro').value || '15:00'; V.bozza.oraPartita = t; go('riepilogo', { bozza: V.bozza }); break; }
    case 'riepilogo': go('riepilogo', { bozza: V.bozza }); break;
    case 'ascolta-riepilogo': {
      const p = V.bozza, d = dettagli(p);
      parla('Viaggio di ' + dataLunga(fromIso(p.data)) + '. Da ' + d.da.nome + ' a ' + d.a.nome + '. ' +
        (d.v.tipo === 'partita' ? d.testoA + '.' : 'Andata alle ' + d.oraA + '.' + (d.v.ritorno ? ' Ritorno alle ' + d.oraR + '.' : '')) +
        ' Costo ' + euro(TARIFFA * d.tratte).replace(' €', ' euro') + '.');
      break;
    }
    case 'apriweb': setTimeout(() => go('web', { bozza: V.bozza }), 50); break;
    case 'web-problema': go('web', { bozza: V.bozza, problema: true }); break;
    case 'web-fatto': registra(V.bozza, 'web'); break;
    case 'telefono': go('telefono', { bozza: V.bozza }); break;
    case 'ascolta-copione': parla(copione(V.bozza).join(' ')); break;
    case 'tel-fatto': registra(V.bozza, 'telefono'); break;
    case 'copia-numero': copia(NUMERO_VERDE.replace(/\s/g, ''), el); break;
    case 'conferma': go('conferma', { id: el.dataset.id }); break;
    case 'salva-conferma': {
      const p = pren(el.dataset.id);
      p.passaggioAndata = (document.getElementById('pass-a') || {}).value || '';
      const r = document.getElementById('pass-r'); if (r) p.passaggioRitorno = r.value || '';
      p.stato = 'confermata'; save(); go('home'); break;
    }
    case 'rifiuta': { const p = pren(el.dataset.id); p.stato = 'rifiutata'; save(); render(); break; }
    case 'annulla': go('annulla', { id: el.dataset.id }); break;
    case 'copia-msg': copia(messaggioCancellazione(pren(V.id)), el); break;
    case 'segna-annullata': { const p = pren(el.dataset.id); p.stato = 'annullata'; save(); go('home'); break; }
    case 'togli': S.prenotazioni = S.prenotazioni.filter(p => p.id !== el.dataset.id); save(); render(); break;
    case 'salva-accredito': { const v = document.getElementById('acc-data').value; S.accredito = { scadenza: v }; save(); go('home'); break; }
    case 'pin': pinBuffer = ''; go('pin'); break;
    case 'pin-n':
      if (pinBuffer.length < 4) pinBuffer += el.dataset.n;
      if (pinBuffer.length === 4) {
        if (pinBuffer === S.pin) { pinBuffer = ''; go('config'); } else { pinBuffer = ''; go('pin', { errore: true }); }
      } else render();
      break;
    case 'pin-c': pinBuffer = pinBuffer.slice(0, -1); render(); break;
    case 'svuota':
      S = { v: 1, esempio: false, pin: S.pin, prova: S.prova, profilo: { nome: '', cognome: '', telefono: '', email: '', accompagnatore: 'nessuno', posto: 'normale' }, accredito: { scadenza: '' }, luoghi: [{ id: uid(), nome: 'Casa', emoji: '🏠', indirizzo: '', citta: 'Cagliari' }], viaggi: [], prenotazioni: [] };
      save(); go('config'); break;
    case 'add-luogo': S.luoghi.push({ id: uid(), nome: 'Nuovo luogo', emoji: '🏢', indirizzo: '', citta: 'Cagliari' }); S.esempio = false; save(); reopen(1); break;
    case 'del-luogo': S.luoghi.splice(+el.dataset.i, 1); save(); reopen(1); break;
    case 'add-viaggio': {
      const casa = S.luoghi[0], altro = S.luoghi[1] || S.luoghi[0];
      S.viaggi.push({ id: uid(), tipo: 'normale', emoji: '🏫', nome: 'Nuovo viaggio', da: casa ? casa.id : '', a: altro ? altro.id : '', oraAndata: '09:00', ritorno: true, oraRitorno: '12:00' });
      S.esempio = false; save(); reopen(2); break;
    }
    case 'add-partita': {
      let st = S.luoghi.find(l => l.emoji === '⚽');
      if (!st) { st = { id: uid(), nome: 'Stadio (Distinti)', emoji: '⚽', indirizzo: 'Unipol Domus, ingresso dedicato settore Distinti', citta: 'Cagliari' }; S.luoghi.push(st); }
      const casa = S.luoghi[0];
      S.viaggi.push({ id: uid(), tipo: 'partita', emoji: '⚽', nome: 'Partita del Cagliari', da: casa.id, a: st.id, oraAndata: '', ritorno: true, oraRitorno: '' });
      save(); reopen(2); break;
    }
    case 'del-viaggio': S.viaggi.splice(+el.dataset.i, 1); save(); reopen(2); break;
    case 'copia-script':
      fetch('amicobus.user.js').then(r => r.text()).then(t => copia(t, el)).catch(() => { el.textContent = 'Non riesco a leggere lo script'; });
      break;
    case 'copia-backup': copia(document.getElementById('backup-out').value, el); break;
    case 'ripristina': {
      try {
        const s = fromB64url(document.getElementById('backup-in').value);
        if (!s || s.v !== 1 || !s.profilo) throw new Error('formato');
        S = s; save(); go('config', { esitoBackup: 'Dati ripristinati.' });
      } catch (err) { go('config', { esitoBackup: 'Il codice non è valido. Controlla di averlo copiato tutto.' }); }
      break;
    }
    case 'reset': go('config', { confermaReset: true }); break;
    case 'reset-no': go('config'); break;
    case 'reset-si': try { localStorage.removeItem(STORE); } catch (err) {} S = esempio(); go('home'); break;
  }
});

function reopen(idx) {
  render();
  const ds = document.querySelectorAll('details');
  ds.forEach((d, i) => { d.open = i === idx; });
}
function scegliData(v, dataIso) {
  const bozza = richiestaDa(v, dataIso);
  if (v.tipo === 'partita') go('partita', { bozza }); else go('riepilogo', { bozza });
}
function registra(bozza, canale) {
  bozza.stato = 'inviata'; bozza.canale = canale;
  delete bozza.apertura; delete bozza.chiusura;
  if (!S.prenotazioni.find(p => p.id === bozza.id)) S.prenotazioni.push(bozza);
  save();
  go('home');
}

/* Dal promemoria del calendario si arriva con #bozza-<id>: apre direttamente quel viaggio. */
function apriDaIndirizzo() {
  const m = /^#bozza-([a-z0-9]+)$/.exec(location.hash || '');
  if (!m) return false;
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  const p = pren(m[1]);
  if (!p) { go('home'); return true; }
  if (p.stato === 'bozza') go('riepilogo', { bozza: p }); else go('home');
  return true;
}
window.addEventListener('hashchange', apriDaIndirizzo);

if (!apriDaIndirizzo()) render();
/* Il semaforo si aggiorna da solo ogni minuto, solo nella schermata iniziale. */
setInterval(() => { if (V.view === 'home') render(); }, 60000);
})();
</script>
